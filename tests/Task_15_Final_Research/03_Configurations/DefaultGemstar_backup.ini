
[ue_camera_feature:sensor1]
;Debug=true
Mount=SensorPlatform_1
;MountingPosition and MountingOrientation are relative to the mount (sensor platform).
;Position in cm, Orientation in °
MountingPositionX=70
MountingPositionY=0
MountingPositionZ=160
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0
;Video resolution in pixels
Width=1920
Height=1080
;Field of view in °
FoVHorizontal=90
FoVVertical=90

;[ue_esmini_feature]
;Debug=true
;relative path in Simulation/OpenSCENARIO
;Path=simple-left-turn/scenario_scenario1_0.xosc

;[ue_fmi_feature:sensormodel1]
;Debug=true
;Input is the source module name
;Input=[lidar:sensor1]
;InputData is the source output data type, mainly defined by ASAM OSI
;InputData=[SensorView]
;InputName is the variable name in the fmu to write the data into
;InputName=[OSMPSensorViewIn]
;The path to the fmu model
;The concrete model has less resolution than https://github.com/openMSL/sl-1-5-reflection-based-fmcw-lidar-detection-model
;Model="Resources/sl-1-5-reflection-based-fmcw-lidar-detection-model-5271.fmu"
;OutputData is the output data type, mainly defined by ASAM OSI
;OutputData=[SensorData]
;OutputName is the variable name in the fmu to read the data from
;OutputName=[OSMPSensorDataOut]

[ue_lidar_feature:sensor1]
;Debug=true
Mount=SensorPlatform_1
MountingPositionX=260
MountingPositionY=0
MountingPositionZ=70
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0
FoVHorizontal=90
FoVVertical=20
NumberOfRaysHorizontal=251
NumberOfRaysVertical=21
simulated view distance in m
Range=100
NoFalloff is reflection shall be 100%
NoFalloff=true
DistanceHalfFalloff for simple model: check?
DistanceHalfFalloff=60
WeatherInput=[ue_weather_effect_feature]

[ue_logger_feature]
;Debug=true
;write global ground truth
GroundTruth=true
;write omega prime, see https://ika-rwth-aachen.github.io/omega-prime/
;OmegaPrime=true
;log information from modules
Input=[ue_raytracing_lidar_feature:Front_Raster]
;log information type
InputData=[SensorView]
;file name prefix followed by ASAM OSI name scheme
FileName=GEMSTAR

[ue_radar_feature:sensor1]
;Mount=SensorPlatform_1
MountingPositionX=1940
MountingPositionY=-2650
MountingPositionZ=250
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0
NumberOfRaysHorizontal=10
NumberOfRaysVertical=10
FoVHorizontal=90
FoVVertical=20
;DistanceHalfFalloff=30

[ue_sumo_feature]
;Debug=true
;relative path in Simulation/SUMO
Parameters="-c practise-area/DrivingPractiseAreaBrunswickMap.sumocfg"

[ue_vehicle_feature]
;Debug=true
;Input are scenario players: esmini, sumo
Input=[ue_sumo_feature]
VehicleDataConfiguration="VehicleDataConfig.json"
;SensorPlatform_X is a platform to mount sensors on. It is the name of the vehicle within in the scenario.
SensorPlatform_1=0
SensorPlatform_2=other
;Sensors are mounted on static infrastructure. Example object is GEMSTAR_Root
StaticSensorPlatform=GEMSTAR_Root
;Log vehicle mapping info
VehicleMappingLog=true
;Logfile name with vehicle mapping
VehicleMappingFileName=GEMSTAR_vehicle_mapping.csv
;Remove vehicle from simulation if no position update reached vehicle feature during simulation frame
ClearAbandonedVehicles=true

[ue_visualizer_feature]
;Debug=true
Input=[ue_lidar_feature:sensor1]
;In Editor Mode shows Field of View from sensors
ShowFoV=false
;If available, show camera in viewport (overlay bottom right)
ShowCamera=true

[ue_vru_feature]
Input=[ue_sumo_feature]

[ue_weather_effect_feature]
;Activate if an external weather data input: ue_esmini_feature or ue_sumo_feature
;Input=ue_sumo_feature
;Weather behavior/ effect is activated/deactivated
WeatherEffectEnabled=true
;Explisit weather type selection: Clear, Fog, Rain, Snow
ActiveWeatherType=Fog
;Meteorological Optical Range in meters for fog condtion
MOR=20.0
;Precipitation Rain or Snow, intensity mm/h
PrecipitationType = Rain
PrecipitationIntensity = 100.0 
;LiDAR weather-model parameters 
LidarCoefficient=1.0
ReflectivityThreshold=10.0
