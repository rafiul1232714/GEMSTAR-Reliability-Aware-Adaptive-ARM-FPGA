
[ue_camera_feature:sensor1]
;Debug=true
Mount=SensorPlatform_1

;MountingPosition and MountingOrientation are relative to the mount (sensor platform).
;Position in cm, Orientation in degrees
MountingPositionX=70
MountingPositionY=0
MountingPositionZ=160
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0

;Video resolution in pixels
Width=1920
Height=1080

;Field of view in degrees
FoVHorizontal=90
FoVVertical=90


;[ue_esmini_feature]
;Debug=true
;Relative path in Simulation/OpenSCENARIO
;Path=simple-left-turn/scenario_scenario1_0.xosc


;[ue_fmi_feature:sensormodel1]
;Debug=true
;Input is the source module name
;Input=[lidar:sensor1]
;InputData=[SensorView]
;InputName=[OSMPSensorViewIn]
;Path to the FMU model
;Model="Resources/sl-1-5-reflection-based-fmcw-lidar-detection-model-5271.fmu"
;OutputData=[SensorData]
;OutputName=[OSMPSensorDataOut]


[ue_lidar_feature:sensor1]
;Debug=true
Mount=SensorPlatform_1

MountingPositionX=260
MountingPositionY=0
MountingPositionZ=70
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0

FoVHorizontal=90
FoVVertical=20

NumberOfRaysHorizontal=251
NumberOfRaysVertical=21

;Simulated view distance in meters
Range=100

;NoFalloff controls reflection falloff
NoFalloff=true

;DistanceHalfFalloff for simple model
DistanceHalfFalloff=60

WeatherInput=[ue_weather_effect_feature]


[ue_logger_feature]
;Debug=true

;Write global ground truth
GroundTruth=true

;Write Omega Prime if needed
;OmegaPrime=true

;Log all three sensor modules
Input=[ue_camera_feature:sensor1,ue_lidar_feature:sensor1,ue_radar_feature:sensor1]

;Corresponding OSI data types
InputData=[SensorView,SensorView,SensorView]

;File name prefix
FileName=GEMSTAR


[ue_radar_feature:sensor1]
;Mount=SensorPlatform_1

MountingPositionX=1940
MountingPositionY=-2650
MountingPositionZ=250

MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0

NumberOfRaysHorizontal=10
NumberOfRaysVertical=10

FoVHorizontal=90
FoVVertical=20

;DistanceHalfFalloff=30


[ue_sumo_feature]
;Debug=true

;Relative path in Simulation/SUMO
Parameters="-c practise-area/DrivingPractiseAreaBrunswickMap.sumocfg"


[ue_vehicle_feature]
;Debug=true

;Input scenario players: esmini, sumo
Input=[ue_sumo_feature]

VehicleDataConfiguration="VehicleDataConfig.json"

;Sensor platforms mounted on scenario vehicles
SensorPlatform_1=0
SensorPlatform_2=other

;Sensors mounted on static infrastructure
StaticSensorPlatform=GEMSTAR_Root

;Log vehicle mapping information
VehicleMappingLog=true
VehicleMappingFileName=GEMSTAR_vehicle_mapping.csv

;Remove abandoned vehicles
ClearAbandonedVehicles=true


[ue_visualizer_feature]
;Debug=true

Input=[ue_lidar_feature:sensor1]

;Show sensor fields of view
ShowFoV=false

;Display camera overlay in viewport
ShowCamera=true


[ue_vru_feature]
Input=[ue_sumo_feature]


[ue_weather_effect_feature]
;Input=ue_sumo_feature

;Activate weather effects
WeatherEffectEnabled=true

;Weather types: Clear, Fog, Rain, Snow
ActiveWeatherType=Fog

;Meteorological Optical Range for fog in meters
MOR=20.0

;Precipitation configuration
PrecipitationType=Rain
PrecipitationIntensity=100.0

;LiDAR weather model parameters
LidarCoefficient=1.0
ReflectivityThreshold=10.0
