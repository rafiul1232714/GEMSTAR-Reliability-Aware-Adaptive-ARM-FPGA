
; =========================================================
; GEMSTAR - CAMERA + LIDAR + RADAR SENSOR CONFIGURATION
; TASK 7: RADAR MOUNTING TEST
; Weather: Fog
; =========================================================


; =========================================================
; CAMERA SENSOR
; =========================================================

[ue_camera_feature:sensor1]
;Debug=true

Mount=SensorPlatform_1

; Position in centimeters
MountingPositionX=70
MountingPositionY=0
MountingPositionZ=160

; Orientation in degrees
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0

; Reduced resolution for testing
Width=640
Height=480

FoVHorizontal=90
FoVVertical=90


; =========================================================
; ESMINI - DISABLED
; =========================================================

;[ue_esmini_feature]
;Debug=true
;Path=simple-left-turn/scenario_scenario1_0.xosc


; =========================================================
; FMI SENSOR MODEL - DISABLED
; =========================================================

;[ue_fmi_feature:sensormodel1]
;Debug=true
;Input=[lidar:sensor1]
;InputData=[SensorView]
;InputName=[OSMPSensorViewIn]
;Model="Resources/sl-1-5-reflection-based-fmcw-lidar-detection-model-5271.fmu"
;OutputData=[SensorData]
;OutputName=[OSMPSensorDataOut]


; =========================================================
; LIDAR SENSOR
; =========================================================

[ue_lidar_feature:sensor1]
;Debug=true

Mount=SensorPlatform_1

MountingPositionX=260
MountingPositionY=0
MountingPositionZ=70

MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0

FoVHorizontal=90
FoVVertical=20

NumberOfRaysHorizontal=251
NumberOfRaysVertical=21

; Maximum simulated range in meters
Range=100

NoFalloff=true
DistanceHalfFalloff=60

WeatherInput=[ue_weather_effect_feature]


; =========================================================
; LOGGER - ALL THREE SENSORS
; =========================================================

[ue_logger_feature]
;Debug=true

; Record simulation ground truth
GroundTruth=true

; Optional Omega Prime recording
;OmegaPrime=true

; Record Camera, LiDAR and Radar
Input=[ue_camera_feature:sensor1,ue_lidar_feature:sensor1,ue_radar_feature:sensor1]

InputData=[SensorView,SensorView,SensorView]

; Output filename prefix
FileName=GEMSTAR


; =========================================================
; RADAR SENSOR - UPDATED FOR TEST
; =========================================================

[ue_radar_feature:sensor1]
;Debug=true

; Mount Radar on the same moving vehicle
Mount=SensorPlatform_1

; Radar mounting position in centimeters
MountingPositionX=200
MountingPositionY=0
MountingPositionZ=80

; Forward-facing orientation
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0

; Radar ray configuration
NumberOfRaysHorizontal=10
NumberOfRaysVertical=10

FoVHorizontal=90
FoVVertical=20

;DistanceHalfFalloff=30


; =========================================================
; SUMO TRAFFIC SIMULATION
; =========================================================
Range=50

[ue_sumo_feature]
;Debug=true

Parameters="-c E:/GEMSTAR_Project/sensor-health-monitor/tests/Task_24_Final_Research/09_Controlled_Scenario/C02_MovingTarget/C02_MovingTarget.sumocfg"


; =========================================================
; VEHICLE CONFIGURATION
; =========================================================

[ue_vehicle_feature]
;Debug=true

; Receive traffic participants from SUMO
Input=[ue_sumo_feature]

VehicleDataConfiguration="VehicleDataConfig.json"

; Mount three sensors on vehicle 0
SensorPlatform_1=0

; Other available platform
SensorPlatform_2=other

; Static infrastructure sensor platform
StaticSensorPlatform=GEMSTAR_Root

; Vehicle mapping logs
VehicleMappingLog=true
VehicleMappingFileName=GEMSTAR_vehicle_mapping.csv

ClearAbandonedVehicles=true


; =========================================================
; SENSOR VISUALIZATION
; =========================================================

[ue_vru_feature]

Input=[ue_sumo_feature]


; =========================================================
; WEATHER CONFIGURATION - FOG
; =========================================================

[ue_weather_effect_feature]

; External weather input disabled
;Input=ue_sumo_feature

WeatherEffectEnabled=false

; Clear, Fog, Rain, Snow
ActiveWeatherType=Clear

; Meteorological Optical Range in meters
MOR=100.0

PrecipitationType=Rain
PrecipitationIntensity=0.0

; LiDAR weather model
LidarCoefficient=1.0
ReflectivityThreshold=10.0

